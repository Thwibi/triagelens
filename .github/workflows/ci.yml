name: CI

# The gates spec 09 names, minus the two that need hardware or a network-isolated
# host: real-browser E2E and a clean-machine offline install. Those are run by
# hand and recorded in docs/validation.md.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: python scripts/task.py backend-lint scripts-lint
      - name: Type-check (mypy strict)
        run: python scripts/task.py backend-typecheck
      # The coverage run executes the whole suite, so it covers the plain test
      # gate too; the floor is 80% overall, with 85% on parsers/detect/ioc/mitre
      # held and recorded in docs/COMPLIANCE.md.
      - name: Tests and coverage
        run: python scripts/task.py backend-coverage

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm run test
      - name: Dependency audit (npm)
        working-directory: frontend
        run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit the pinned runtime dependencies
        run: pip-audit -r backend/requirements.lock
