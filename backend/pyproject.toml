[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "triagelens"
version = "0.1.0"
description = "TriageLens - standalone, fully local log triage tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "regex==2026.9.29",
    "lxml==6.1.3",
    # zoneinfo has no database on Windows, so the IANA rules have to ship with
    # the app: parsing a naive log timestamp in a case timezone needs them.
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    # Starlette 1.7's TestClient needs httpx2; httpx itself stays for direct use.
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "mypy==2.4.0",
    "ruff==0.16.10",
    "types-PyYAML==6.0.12.20260906",
    "types-regex==2026.9.10.20260911",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "migrations", "data", "rules", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]
extend-exclude = ["app/static", "frontend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "DTZ",  # naive datetimes
    "T10",  # debugger
    "T20",  # print
    "SIM",  # simplify
    "PTH",  # pathlib
    "RUF",  # ruff-specific
    "S",    # bandit
    "ASYNC",
    "PL",   # pylint subset
    "TRY",  # tryceratops
    "G",    # logging format
    "ARG",  # unused arguments
    "FBT",  # boolean trap
    "ISC",  # implicit string concat
    "ICN",  # import conventions
    "LOG",  # logging misuse
    "PIE",
    "PT",   # pytest style
    "Q",    # quotes
    "RSE",  # raise
    "RET",  # return
    "SLF",  # private member access
    "TID",  # tidy imports
    "YTT",  # sys.version
]
ignore = [
    "PLR0913", # too many arguments - repository methods legitimately take many
    "S101",    # assert - used in tests and internal invariants
    "TRY003",  # long messages in raise - the message is the user-facing diagnostic
    "TRY400",  # logging.exception - errors here are logged with an explicit exc_info
]

[tool.ruff.lint.per-file-ignores]
# S608 fires on f-string SQL. Every case interpolates a module-level constant or
# an int already validated by config; no request value is ever concatenated.
"app/db/*" = ["S608"]
# S608 fires on INSERT_SQL, which interpolates only the module-level
# EVENT_COLUMNS tuple. No request or record value ever reaches the SQL text.
"app/ingest/events.py" = ["S608"]
# PLC0415: local imports break import cycles between config, db and api layers.
"app/*" = ["PLC0415"]
# B008: Depends() in a default is the FastAPI idiom for dependency injection.
"app/api/routers/*" = ["B008"]
# DTZ007: parse_timestamp deliberately parses naive timestamps and then either
# rejects them or localizes them with an explicit zone before anything is
# stored. Making strptime require %z here would hide the real decision point.
"app/ingest/normalize.py" = ["DTZ007"]
# PT012 and SIM117: a nested `with` inside `pytest.raises` is the assertion.
"tests/*" = [
    "S", "PLR2004", "ARG", "SLF", "PT011", "TRY", "RUF043", "PLC0415",
    "PT012", "SIM117", "FBT001",
]
"scripts/*" = ["T20", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = false
plugins = ["pydantic.mypy"]
mypy_path = "app"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["lxml.*", "regex", "yaml", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "slow: long running test",
    "perf: performance benchmark",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]